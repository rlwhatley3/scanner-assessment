[package]
name = "secrets-scanner-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.13.1"
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", optional = true }
tract-onnx = { version = "0.23.9", optional = true }

[features]
# Model rules: runs ONNX models with tract. Off by default so builds that don't need models stay
# small; without it, model rules report that the engine was built without model support.
ml = ["dep:sha2", "dep:tract-onnx"]

[dev-dependencies]
# Builds the small ONNX models the model rule tests run; same version tract-onnx uses.
prost = "0.14"
