[package]
name = "secrets-scanner-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
crc32fast = "1.5.2"
md-5 = "0.10"
regex = "1.13.1"
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10.9"
tract-onnx = { version = "0.23.9", optional = true }

[features]
# Model rules: runs ONNX models with tract. Off by default so builds that don't need models stay
# small; without it, model rules report that the engine was built without model support.
ml = ["dep:tract-onnx"]

[dev-dependencies]
# Builds the small ONNX models the model rule tests run; same version tract-onnx uses.
prost = "0.14"

# Fingerprints use Argon2id, which is deliberately slow; unoptimized it is about 20 times slower,
# which would make debug builds and tests crawl. Optimize just these crates in dev builds.
[profile.dev.package.argon2]
opt-level = 3
