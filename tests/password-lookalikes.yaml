# Expected: no Password-shaped value findings, and no findings at all.
# Every value has something password-like about it (mixed case, digits, symbols, or a word
# such as "password" or "login"), but each is an ordinary setting: a name in a regular style,
# a version, an ID, a hash, a path, a URL, a reference, or a short plain word.
deploy:
  service_name: paymentGatewayClient
  component: PasswordResetService
  event: password_reset_requested
  queue: AUTH-LOGIN-EVENTS
  role: admin
  resource_kind: Secret
  default_user: guest
  image_tag: v2.14.0-rc1
  build_number: 20261028.4
  base_image: node:24-alpine
  os_image: ubuntu2204
  schedule: "0 3 * * 1"
  digest: d41d8cd98f00b204e9800998ecf8427e
  request_id: 1f3a7c2e-8b4d-4e6f-9a1b-2c3d4e5f6a7b
  docs: "https://docs.example.com/auth/reset"
  mount_path: /var/run/app/config
  timezone: America/New_York
  alerts: billing-alerts@example.com
  db_ref: "${DB_PASSWORD}"
  chart_value: "{{ .Values.adminUser }}"
  encoding: base64Url
  codec: utf8Encoder
  bucket: s3BucketLogs
  brand_color: "#FF5733CC"
  sku: ABC-1234-XYZ
  window_title: "Invoices (Q3)"
  version_range: ">=1.2.3 <2.0.0"
