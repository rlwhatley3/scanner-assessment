# Settings for a billing worker. Several values are passwords a person made up, stored under
# names that don't suggest a secret, so only the Password-shaped value rule can catch them.
#
# Expected, Password-shaped value (low): the values of safe_bet, backup_phrase, vault_door,
# bob_said, old_login_value, temp_access, and reminder. Quoted and unquoted values both count.
# Expected, Secret-looking assignment (medium): the value of db_password, reported once, not
# again as password-shaped.
# Expected, nothing: every other setting.
app:
  name: billing-worker
  region: us-east-1
  image: ghcr.io/acme/billing-worker:2.14.0
  replicas: 3
  log_level: info
  handler: invoiceRetryHandler
  feature_flags: checkout_v2,fast_refunds
  safe_bet: "myUnencryptedPWHERE"
  backup_phrase: Summer2024!
  vault_door: 'Tr0ub4dor&3'
  bob_said: s3cretSauce99
  old_login_value: "P@ssw0rd!"
  temp_access: "hunter2"
  reminder: Welcome123!
  db_password: "Xk9mQ2vL7pR4w!"
