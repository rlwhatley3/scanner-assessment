[package]
name = "secrets-scanner-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["fs", "macros", "rt-multi-thread"] }
utoipa = "6.0.0"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
